site_name: F1 Copilot Workshop
site_description: Learn AI-assisted and AI-native development, from WSL setup to practical Copilot and Spec Kit labs.
site_url: https://cknzraposo.github.io/f1-app/
repo_url: https://github.com/cknzraposo/f1-app
repo_name: Source repository
edit_uri: edit/master/_docs/tutorials/
docs_dir: _docs/tutorials
site_dir: site
use_directory_urls: false
watch:
  - theme

theme:
  name: mkdocs
  custom_dir: theme
  color_mode: dark
  highlightjs: false
  navigation_depth: 3
  favicon: assets/favicon.svg

nav:
  - Start here: index.md
  - "1. Get race-ready":
      - "Windows + WSL": wsl-setup.md
      - "Project setup": setup.md
  - "2. Work with AI":
      - "AI-assisted vs AI-native": ai-development.md
      - "A: Copilot-native": copilot-native.md
      - "B: Copilot + Spec Kit": copilot-spec-kit.md
  - "3. Practise":
      - Repair lab: repair-lab.md
      - Feature lab: feature-lab.md
  - "4. Compare and reflect": assessment.md
  - "For publishers": publishing.md

exclude_docs: |
  README.md
  checks/

hooks:
  - scripts/pages_links.py

extra_css:
  - assets/tutorial.css

extra_javascript:
  - assets/tutorial.js

markdown_extensions:
  - tables
  - fenced_code
  - md_in_html
  - toc:
      permalink: true
