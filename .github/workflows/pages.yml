name: Publish tutorial to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "_docs/tutorials/**"
      - "scripts/pages_links.py"
      - "tests_pages/**"
      - "mkdocs.yml"
      - "requirements-pages.txt"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [master]
    paths:
      - "_docs/tutorials/**"
      - "scripts/pages_links.py"
      - "tests_pages/**"
      - "mkdocs.yml"
      - "requirements-pages.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tutorial-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAGES_REPOSITORY: ${{ github.repository }}
      PAGES_SOURCE_REF: ${{ github.sha }}
      PAGES_EDIT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pages.txt
      - name: Install publishing dependencies
        run: python -m pip install -r requirements-pages.txt
      - name: Test tutorial links and generated site
        run: python -m unittest discover -s tests_pages -v
      - name: Build static tutorial
        run: python -m mkdocs build --strict
      - name: Upload only the built website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
